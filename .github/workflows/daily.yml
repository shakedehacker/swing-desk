name: daily-report
on:
  # Backup only: the Mac (daily.sh via launchd) is the daily runner and deploys to Vercel.
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python report.py
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }   # optional free fallback when ai.json is missing
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
      # Scheduled workflows stop after 60 days without repo activity; a dated commit keeps them alive.
      - run: |
          date -u +%F > last_run.txt
          git config user.name desk-bot && git config user.email desk-bot@users.noreply.github.com
          git add last_run.txt history.json picks.json && git commit -m "report $(date -u +%F)" && git pull --rebase && git push || true
